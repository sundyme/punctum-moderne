<!doctype html>
<html><head><meta charset="utf-8"><title>film2 dev</title>
<style>html,body{margin:0;background:#111;color:#ccc;font:12px monospace}canvas{width:100%;display:block}#bar{position:fixed;left:0;right:0;bottom:0;padding:4px;background:#000a}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<div id="bar"><input id="s" type="range" min="0" max="48" step="0.01" style="width:70%"> <span id="l"></span></div>
<script src="assets/glyphs.js"></script><script src="assets/shaders.js"></script><script src="assets/film.js"></script>
<script>
const F = createFilm(window.PM_GLYPHS);
const q = new URLSearchParams(location.search);
const R = F.attach(document.getElementById('c'), { ss: +(q.get('ss') || 1) });
window.R = R; window.F = F;
function go(t){ const t0=performance.now(); R.draw(t); R.gl.finish(); document.getElementById('l').textContent = t.toFixed(3)+'s  '+(performance.now()-t0).toFixed(1)+'ms'; s.value=t; }
window.go = go;
const s = document.getElementById('s'); s.oninput = () => go(+s.value);
go(+(q.get('t') || 0));
if (R.errors.length) document.title = 'ERR';
</script></body></html>
