<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/glyphs.js"></script>
    <script src="assets/film.js"></script>
    <style>
      @font-face { font-family: "Punctum Moderne"; src: url("assets/fonts/PunctumModerne-VF.woff2") format("woff2"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0B0A0D; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #fontprobe { position: absolute; left: -9999px; top: 0; font-family: "Punctum Moderne"; font-weight: 500; font-size: 17px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <canvas id="stage" class="clip" width="1920" height="1080" data-start="0" data-duration="30" data-track-index="0" data-layout-allow-overflow></canvas>
      <audio id="score" src="assets/score.wav" data-start="0" data-duration="30" data-track-index="5"></audio>
    </div>
    <span id="fontprobe">PUNCTUM</span>
    <script>
      const F = createSignal(window.PM_GLYPHS);
      const ctx = document.getElementById("stage").getContext("2d");
      const clock = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(clock, { t: 30, duration: 30, ease: "none", onUpdate: () => F.draw(ctx, Math.min(clock.t, 29.999)) }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      F.draw(ctx, 0);
      document.fonts.load('500 17px "Punctum Moderne"').then(() => F.draw(ctx, Math.min(clock.t, 29.999)));
    </script>
  </body>
</html>
