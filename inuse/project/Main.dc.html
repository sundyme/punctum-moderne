<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Punto per punto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..500&amp;display=swap">
<style>
@font-face { font-family: "Punctum Moderne"; src: url("/_blob/d3c53ecf9f4eda84a99d0694877a6bff") format("woff2"); font-weight: 100 900; font-display: block; }
body { margin: 0; }
</style>
</helmet>

<div style="width: 900px; height: 1200px; box-sizing: border-box; padding: 56px 64px 52px; background: {{bg}}; color: #F3EFE6; font-family: 'Punctum Moderne', 'Bodoni Moda', serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; justify-content: space-between; align-items: baseline; font-size: 22px; font-variation-settings: 'wght' 600, 'CNTR' 100; padding-bottom: 18px; border-bottom: 1px solid rgba(243,239,230,.45)">
    <span>Mostra di caratteri</span><span>Parma</span><span style="font-variant-numeric: tabular-nums">12.03–30.06.2027</span>
  </div>
  <div style="margin-top: 56px; display: flex; flex-direction: column">
    <div style="font-size: 352px; line-height: 264px; height: 264px; white-space: nowrap; color: #F3EFE6; font-variation-settings: 'wght' 900, 'CNTR' {{cntr}}">Punto</div>
    <div style="font-size: 352px; line-height: 264px; height: 264px; white-space: nowrap; color: #CDBFEA; font-variation-settings: 'wght' 900, 'CNTR' {{cntr}}">per</div>
    <div style="font-size: 352px; line-height: 264px; height: 264px; white-space: nowrap; color: #F3EFE6; font-variation-settings: 'wght' 900, 'CNTR' {{cntr}}">punto</div>
  </div>
  <div style="margin-top: auto; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 40px; align-items: end; padding-top: 22px; border-top: 1px solid rgba(243,239,230,.45)">
    <p style="margin: 0; font-family: 'Bodoni Moda', serif; font-style: italic; font-size: 30px; line-height: 1.3; max-width: 15em">Una mostra sulla tipografia a punti, da Bodoni alla macchina.</p>
    <div style="font-size: 22px; line-height: 1.45; text-align: right; font-variation-settings: 'wght' 600, 'CNTR' 100">Ingresso libero<br>mar–dom 10–18</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bg": {"editor": "color", "default": "#4E347D", "options": ["#4E347D", "#131313", "#1E3B34"]}, "cntr": {"editor": "range", "default": 100, "min": 0, "max": 100, "step": 1}, "$preview": {"width": 900, "height": 1200}}'>
class Component extends DCLogic {
renderVals() { return { bg: this.props.bg ?? '#4E347D', cntr: this.props.cntr ?? 100 }; }
}
</script>
</body>
</html>
